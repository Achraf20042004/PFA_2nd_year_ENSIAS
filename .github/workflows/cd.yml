name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write   # needed to push to GHCR

jobs:
  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/medtrain-backend
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (stub)
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production   # requires manual approval via GitHub Environment rules

    steps:
      - name: Echo image info
        run: |
          echo "Image: ${{ needs.build-and-push.outputs.image }}"
          echo "Digest: ${{ needs.build-and-push.outputs.digest }}"

      # ── TODO: replace this step with your actual deployment mechanism ───────
      # Examples:
      #   - SSH into server and docker pull + restart
      #   - Trigger a Kubernetes rollout (kubectl set image ...)
      #   - Call a webhook on Render / Railway / Fly.io
      # ────────────────────────────────────────────────────────────────────────
      - name: Deploy to production server
        run: |
          echo "⚠️  Deploy step not yet configured."
          echo "Set up your deployment target and replace this step."
          echo "Image to deploy: ghcr.io/${{ github.repository_owner }}/medtrain-backend:latest"
